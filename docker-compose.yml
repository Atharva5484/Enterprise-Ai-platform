version: '3.8'

services:
  nexusml-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://nexusadmin:NexusML_SecurePass_2026!@postgres:5432/nexusml_db
      - REDIS_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - FEAST_S3_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: nexusml-postgres
    environment:
      POSTGRES_USER: nexusadmin
      POSTGRES_PASSWORD: NexusML_SecurePass_2026!
      POSTGRES_DB: nexusml_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexusml-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: nexusml-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: nexusml-mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://nexusadmin:NexusML_SecurePass_2026!@postgres:5432/nexusml_db
      - ARTIFACT_ROOT=s3://nexusml-artifacts/
    command: mlflow server --backend-store-uri postgresql://nexusadmin:NexusML_SecurePass_2026!@postgres:5432/nexusml_db --default-artifact-root s3://nexusml-artifacts/ --host 0.0.0.0 --port 5000
    depends_on:
      - postgres
      - minio

  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: nexusml-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:10.3.0
    container_name: nexusml-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  pgdata:
  miniodata:
